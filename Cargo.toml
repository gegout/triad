[package]
name = "triad"
version = "0.2.0"
edition = "2021"
description = "A small local three-agent research lab with shared semantic memory"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31.3", features = ["process", "signal", "user"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process", "fs"] }
toml = "1.1.8"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
codegen-units = 1
